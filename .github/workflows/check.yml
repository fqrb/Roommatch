name: Check ROOM listings

on:
  schedule:
    # GitHub cron can't go below 5 minutes, so each run loops and checks every
    # 30 seconds for ~55 minutes; the next scheduled run queues behind it.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification (newest matching listing) instead of checking"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: check-listings
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send test notification
        if: inputs.test
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python roommatch_notifier.py --test

      - name: Check for new listings every 30 seconds
        if: ${{ !inputs.test }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -u roommatch_notifier.py --loop 3300 --interval 30
